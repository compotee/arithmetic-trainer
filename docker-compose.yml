services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://trainer:trainer@db:5432/trainer
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - trainer-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=trainer
      - POSTGRES_PASSWORD=trainer
      - POSTGRES_DB=trainer
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trainer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    networks:
      - trainer-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  trainer-net:
    driver: bridge
